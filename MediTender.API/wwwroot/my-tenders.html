<!doctype html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MediProcure AI - My Tenders</title>
        <script src="./script/config.js"></script>
        <link rel="stylesheet" href="./style/theme.css">
        <link rel="stylesheet" href="./style/my-tenders.css">
        <link rel="stylesheet" href="./style/home.css">
        <style>header {position: relative;}</style>

        <!-- SEO Meta Tags -->
        <meta name="description" content="MediProcure AI - The future of intelligent medical tendering and vendor offer analysis.">
        
        <!-- Open Graph  -->
        <meta property="og:title" content="MediProcure AI">
        <meta property="og:description" content="AI-powered medical tendering and vendor offer evaluation system.">
        <meta property="og:image" content="./assets/og-preview.png">
        <meta property="og:type" content="website">
        
        <!-- Favicon  -->
        <link rel="icon" type="image/png" href="./assets/logo.png">
        <link rel="logo" href="./assets/logo.png">
    </head>
    <body>
        <header>
            <a href="home.html" class="logo">
                <img src="./assets/logo.png" alt="Icon" class="logo-icon">
                MediProcure <span>AI</span>
            </a>
            <div>
                <a href="upload.html" class="btn-new">➕ New Evaluation</a>
            </div>
        </header>

        <div class="main-container">
            <h1>My Tenders History 📂</h1>
            <p class="subtitle">Access and review all your previously evaluated tenders and vendor comparisons.</p>
            
            <div id="tableContainer">
                <div class="loading" id="loadingState">Loading your tenders...</div>
                <table id="tendersTable" style="display: none;">
                    <thead>
                        <tr>
                            
                            <th>Tender Title</th>
                            <th>Date Created</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="tendersBody">
                        <!-- Rows will be injected here -->
                    </tbody>
                </table>
                <div id="emptyState" class="loading" style="display: none; color: var(--danger-color);">
                    No tenders found. Start by creating a new evaluation.
                </div>
            </div>
        </div>

        <script src="./script/my-tenders.js"></script>
    </body>
</html>
