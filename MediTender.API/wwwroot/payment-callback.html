<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MediProcure AI - Payment Status</title>
    <script src="config.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f8fafc; }
        .status-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
    </style>
</head>
<body>
    <div class="status-box">
        <h2 id="statusMessage" style="color: #1e293b;">Verifying payment... ⏳</h2>
        <p id="statusSubtext" style="color: #64748b;">Please wait while we confirm your transaction with the server.</p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const params = new URLSearchParams(window.location.search);
            const success = params.get("success");
            const statusMessage = document.getElementById("statusMessage");
            const statusSubtext = document.getElementById("statusSubtext");
            const token = sessionStorage.getItem("jwt_token");

            function showFailure() {
                statusMessage.innerText = "Payment Failed or Cancelled ❌";
                statusMessage.style.color = "#ef4444";
                statusSubtext.innerText = "Redirecting you back to plan selection...";
                setTimeout(() => window.location.replace("subscription.html"), 2000);
            }

            function showSuccess(plan) {
                statusMessage.innerText = "Payment Successful! 🎉";
                statusMessage.style.color = "#10b981";
                statusSubtext.innerText = "Redirecting to your dashboard...";
                sessionStorage.setItem("meditender_plan", plan);
                sessionStorage.removeItem("meditender_cached_quota");
                setTimeout(() => window.location.replace("upload.html"), 1500);
            }

            if (success !== "true" || !token) {
                showFailure();
                return;
            }

            const maxAttempts = 6;
            const delayMs = 1500;

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                try {
                    const res = await fetchWithTimeout(`${CONFIG.API_BASE_URL}/api/Auth/me`, {
                        headers: { "Authorization": `Bearer ${token}` }
                    });

                    if (res.ok) {
                        const me = await res.json();
                        if (me.plan === "monthly" || me.plan === "annually") {
                            showSuccess(me.plan);
                            return;
                        }
                    }
                } catch (e) {
                }

                statusSubtext.innerText = `Confirming with server... (${attempt}/${maxAttempts})`;
                await new Promise(r => setTimeout(r, delayMs));
            }
            statusMessage.innerText = "Still Confirming Your Payment ⏳";
            statusMessage.style.color = "#f59e0b";
            statusSubtext.innerText = "This is taking longer than usual. If your payment succeeded, your plan will update shortly — you can also refresh this page.";
        });    
    </script>
</body>
</html>
