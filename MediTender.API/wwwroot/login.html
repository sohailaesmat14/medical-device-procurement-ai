<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediProcure AI - Login</title>
    <script src="./script/config.js"></script>
    <link rel="stylesheet" href="./style/theme.css">
    <link rel="stylesheet" href="./style/auth.css">
    <link rel="stylesheet" href="./style/home.css">

    <!-- SEO Meta Tags -->
        <meta name="description" content="MediProcure AI - The future of intelligent medical tendering and vendor offer analysis.">
        
        <!-- Open Graph  -->
        <meta property="og:title" content="MediProcure AI">
        <meta property="og:description" content="AI-powered medical tendering and vendor offer evaluation system.">
        <meta property="og:image" content="./assets/og-preview.png">
        <meta property="og:type" content="website">
        
        <!-- Favicon  -->
        <link rel="icon" type="image/png" href="./assets/logo.png">
        <link rel="logo" href="./assets/logo.png">
</head>
<body>

    <div class="auth-container">
        <a href="home.html" class="logo">
               <span>MediProcure</span>  <span>AI</span>
        </a>
        <div class="avatar-placeholder">🔒</div>
        
        <h2 style="color: #1e293b; margin-top: 0; margin-bottom: 10px;">Account Login</h2>
        <p style="color: #64748b; font-size: 14px; margin-bottom: 25px;">Please authenticate to access the evaluation system.</p>
        
        <div id="errorMsg" class="error-msg" aria-live="assertive"></div>

        <form id="loginForm" onsubmit="event.preventDefault(); performLogin();">
            <div class="input-group">
                <label for="username">Email</label>
                <input type="email" id="username" placeholder="Enter your email" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-container">
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <button type="button" class="toggle-password" aria-label="Toggle password visibility" title="Show/Hide Password" onclick="togglePasswordVisibility('password', this)">👁️</button>                </div>
                </div>
                <div style="text-align: right; margin-bottom: 20px;">
                    <a href="forgot-password.html" style="font-size: 13px; color: #2563eb; text-decoration: none; font-weight: bold;">Forgot Password?</a>
                </div>

            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <div class="signup-link">
            Don't have an account? <a href="signup.html">Create one here</a>
        </div>
    </div>
    <script src="./script/login.js"></script>
</body>
</html>
