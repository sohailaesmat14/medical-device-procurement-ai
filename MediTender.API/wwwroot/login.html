<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediProcure AI - Login</title>
    <script src="config.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f4f7f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); width: 100%; max-width: 400px; text-align: center; margin: 20px; }
        .logo { font-size: 24px; font-weight: bold; margin-bottom: 20px; color: #111827; text-decoration: none; display: inline-block; }
        .logo span { color: #10b981; }
        .avatar-placeholder { width: 80px; height: 80px; background-color: #e2e8f0; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px auto; font-size: 32px; color: #94a3b8; border: 2px dashed #cbd5e1; }
        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #475569; font-weight: bold; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; transition: border-color 0.3s; }
        input[type="text"]:focus, input[type="password"]:focus { outline: none; border-color: #2563eb; }
        .login-btn { background-color: #2563eb; color: white; border: none; width: 100%; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .login-btn:hover { background-color: #1d4ed8; }
        .error-msg { color: #dc2626; font-size: 14px; margin-bottom: 15px; display: none; font-weight: bold; background: #fee2e2; padding: 10px; border-radius: 6px; }
        .signup-link { margin-top: 20px; font-size: 14px; color: #64748b; }
        .signup-link a { color: #2563eb; font-weight: bold; text-decoration: none; }
        .signup-link a:hover { text-decoration: underline; }
        .password-container { position: relative; display: flex; align-items: center; }
        .password-container input { padding-right: 40px; }
        .toggle-password { position: absolute; right: 10px; background: none; border: none; cursor: pointer; font-size: 18px; color: #64748b; padding: 0; }
    </style>
</head>
<body>

    <div class="login-container">
        <a href="home.html" class="logo">MediProcure <span>AI</span> </a>
        
        <div class="avatar-placeholder">🔒</div>
        
        <h2 style="color: #1e293b; margin-top: 0; margin-bottom: 10px;">Account Login</h2>
        <p style="color: #64748b; font-size: 14px; margin-bottom: 25px;">Please authenticate to access the evaluation system.</p>
        
        <div id="errorMsg" class="error-msg" aria-live="assertive"></div>

        <form id="loginForm" onsubmit="event.preventDefault(); performLogin();">
            <div class="input-group">
                <label for="username">Email Address</label>
                <input type="text" id="username" placeholder="Enter your email" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-container">
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <button type="button" class="toggle-password" aria-label="Toggle password visibility" title="Show/Hide Password" onclick="togglePasswordVisibility('password', this)">👁️</button>                
                </div>
            </div>
            <div style="text-align: right; margin-bottom: 20px;">
                <a href="forgot-password.html" style="font-size: 13px; color: #2563eb; text-decoration: none; font-weight: bold;">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <div class="signup-link">
            Don't have an account? <a href="signup.html">Create one here</a>
        </div>
    </div>

   <script>
        async function performLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const loginBtn = document.querySelector('.login-btn');

            loginBtn.disabled = true;
            loginBtn.innerText = "Signing in...";

            try {
                const response = await fetch(`${CONFIG.API_BASE_URL}/api/Auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: user, password: pass })
                });

                if (response.ok) {
                    const data = await response.json();
                    sessionStorage.setItem("jwt_token", data.token);
                    sessionStorage.setItem("user_name", data.fullName || user);
                    sessionStorage.setItem("user_email", user); 
                    
                    if (data.isExpired) {
                        window.location.replace("subscription.html");
                    } else {
                        sessionStorage.setItem("meditender_plan", data.plan);
                        window.location.replace("upload.html");
                    }
                } else {
                    const errorData = await response.json();
                    errorMsg.innerText = errorData.message || "Invalid credentials. Try again.";
                    errorMsg.style.display = "block";
                    loginBtn.disabled = false;
                    loginBtn.innerText = "Sign In";
                }
            } catch (error) {
                errorMsg.innerText = "Server connection error.";
                errorMsg.style.display = "block";
                loginBtn.disabled = false;
                loginBtn.innerText = "Sign In";
            }
        }
    </script>
</body>
</html>
