<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediProcure AI - Login</title>
    <script src="./script/config.js"></script>
    <link rel="stylesheet" href="./style/theme.css">
    <link rel="stylesheet" href="./style/auth.css">
</head>
<body>

    <div class="login-container">
        <a href="home.html" class="logo">MediProcure <span>AI</span> </a>
        
        <div class="avatar-placeholder">🔒</div>
        
        <h2 style="color: #1e293b; margin-top: 0; margin-bottom: 10px;">Account Login</h2>
        <p style="color: #64748b; font-size: 14px; margin-bottom: 25px;">Please authenticate to access the evaluation system.</p>
        
        <div id="errorMsg" class="error-msg" aria-live="assertive"></div>

        <form id="loginForm" onsubmit="event.preventDefault(); performLogin();">
            <div class="input-group">
                <label for="username">Email</label>
                <input type="email" id="username" placeholder="Enter your email" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-container">
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <button type="button" class="toggle-password" aria-label="Toggle password visibility" title="Show/Hide Password" onclick="togglePasswordVisibility('password', this)">👁️</button>                </div>
                </div>
                <div style="text-align: right; margin-bottom: 20px;">
                    <a href="forgot-password.html" style="font-size: 13px; color: #2563eb; text-decoration: none; font-weight: bold;">Forgot Password?</a>
                </div>

            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <div class="signup-link">
            Don't have an account? <a href="signup.html">Create one here</a>
        </div>
    </div>

    <script>
        async function performLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const loginBtn = document.querySelector('.login-btn');

            loginBtn.disabled = true;
            loginBtn.innerText = "Signing in...";

            try {
                const response = await fetchWithTimeout(`${CONFIG.API_BASE_URL}/api/Auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                if (response.ok) {
                    const data = await response.json();
                    sessionStorage.setItem("jwt_token", data.token);
                    sessionStorage.setItem("user_name", data.fullName || user);
                    sessionStorage.setItem("user_email", user);
                    
                    if (data.plan && data.plan.trim() !== "") {
                        sessionStorage.setItem("meditender_plan", data.plan);
                        window.location.replace("upload.html");
                    } else {
                        window.location.replace("subscription.html");
                    }
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    
                    if (response.status === 403 && errorData.requiresVerification) {
                        sessionStorage.setItem("temp_user_email", user);
                        errorMsg.className = "error-msg";
                        errorMsg.style.backgroundColor = "#fef3c7";
                        errorMsg.style.color = "#d97706";
                        errorMsg.innerText = "Account not verified. Redirecting to verification...";
                        errorMsg.style.display = "block";
                        setTimeout(() => window.location.replace("verify-email.html"), 2000);
                    } else {
                        errorMsg.className = "error-msg";
                        errorMsg.style.backgroundColor = "#fee2e2";
                        errorMsg.style.color = "#dc2626";
                        errorMsg.innerText = errorData.message || "Invalid credentials. Try again.";
                        errorMsg.style.display = "block";
                        loginBtn.disabled = false;
                        loginBtn.innerText = "Sign In";
                    }
                }
            } catch (error) {
                errorMsg.className = "error-msg";
                errorMsg.style.backgroundColor = "#fee2e2";
                errorMsg.style.color = "#dc2626";
                errorMsg.innerText = "Server connection error.";
                errorMsg.style.display = "block";
                loginBtn.disabled = false;
                loginBtn.innerText = "Sign In";
            }
        }    
    </script>
</body>
</html>
