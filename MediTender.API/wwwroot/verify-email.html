<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediProcure AI - Verify Email</title>
    <script src="./script/config.js"></script>
    <link rel="stylesheet" href="./style/theme.css">
    <link rel="stylesheet" href="./style/auth.css">
    <link rel="stylesheet" href="./style/home.css">

    <!-- SEO Meta Tags -->
        <meta name="description" content="MediProcure AI - The future of intelligent medical tendering and vendor offer analysis.">
        
        <!-- Open Graph  -->
        <meta property="og:title" content="MediProcure AI">
        <meta property="og:description" content="AI-powered medical tendering and vendor offer evaluation system.">
        <meta property="og:image" content="./assets/og-preview.png">
        <meta property="og:type" content="website">
        
        <!-- Favicon  -->
        <link rel="icon" type="image/png" href="./assets/favicon.png">
        <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
</head>
<body>
    <div class="auth-container">
        <a href="home.html" class="logo"><span>MediProcure</span>  <span>AI</span></a>
        <div class="avatar-placeholder">✉️</div>
        
        <h2 style="color: var(--text-main); margin-top: 0; margin-bottom: 10px;">Verify Your Email</h2>
        <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 25px;">Please enter your email and the 6-digit verification code.</p>        
        
        <div id="errorMsg" class="error-msg"></div>

        <form onsubmit="event.preventDefault(); verifyEmail();">
            <div class="input-group" id="emailGroup">
                <label for="emailInput">Work Email</label>
                <input type="email" id="emailInput" placeholder="name@hospital.com" required>
            </div>
            <div class="input-group">
                <label for="verificationCode">Verification Code</label>
                <input type="text" id="verificationCode" placeholder="000000" maxlength="6" required>
            </div>
            <button type="submit" class="auth-btn" id="verifyBtn">Verify & Continue</button>
            <div style="margin-top: 20px; font-size: 14px; color: var(--text-muted);">
                Didn't receive the code? 
                <button type="button" id="resendBtn" onclick="resendCode()" style="background: none; border: none; color: var(--primary-blue); font-weight: bold; cursor: pointer; padding: 0;">Resend Code</button>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const storedEmail = sessionStorage.getItem("temp_user_email");
            if (storedEmail) {
                document.getElementById("emailInput").value = storedEmail;
            }
        });

        async function verifyEmail() {
            const code = document.getElementById('verificationCode').value.trim();
            const email = document.getElementById('emailInput').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.getElementById('verifyBtn');

            if (!email) {
                errorMsg.innerText = "Please enter your email.";
                errorMsg.style.display = "block";
                return;
            }

            btn.disabled = true;
            btn.innerText = "Verifying...";

            try {
                const response = await fetchWithTimeout(`${CONFIG.API_BASE_URL}/api/Auth/verify-email`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, code: code })
                });

                if (response.ok) {
                    const data = await response.json();
                    sessionStorage.setItem("jwt_token", data.token);
                    sessionStorage.setItem("user_email", email); 
                    sessionStorage.removeItem("temp_user_email"); 
                    window.location.replace("subscription.html");
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    errorMsg.className = "error-msg";
                    errorMsg.style.backgroundColor = "#fee2e2";
                    errorMsg.style.color = "#dc2626";
                    errorMsg.innerText = errorData.message || "Invalid code.";
                    errorMsg.style.display = "block";
                    btn.disabled = false;
                    btn.innerText = "Verify & Continue";
                }
            } catch (error) {
                errorMsg.className = "error-msg";
                errorMsg.style.backgroundColor = "#fee2e2";
                errorMsg.style.color = "#dc2626";
                errorMsg.innerText = "Server connection error.";
                errorMsg.style.display = "block";
                btn.disabled = false;
                btn.innerText = "Verify & Continue";
            }
        }

        async function resendCode() {
            const email = document.getElementById('emailInput').value.trim();
            const resendBtn = document.getElementById('resendBtn');
            const errorMsg = document.getElementById('errorMsg');

            if (!email) {
                errorMsg.className = "error-msg";
                errorMsg.style.backgroundColor = "#fee2e2";
                errorMsg.style.color = "#dc2626";
                errorMsg.innerText = "Please enter your email first to resend the code.";
                errorMsg.style.display = "block";
                return;
            }

            resendBtn.disabled = true;
            let timeLeft = 30; 
            
            const countdownInterval = setInterval(() => {
                resendBtn.innerText = `Wait ${timeLeft}s`;
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    resendBtn.innerText = "Resend Code";
                    resendBtn.disabled = false;
                }
            }, 1000);

            try {
                const response = await fetchWithTimeout(`${CONFIG.API_BASE_URL}/api/Auth/resend-verification`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                if (response.ok) {
                    errorMsg.className = "error-msg"; 
                    errorMsg.style.backgroundColor = "#d1fae5"; 
                    errorMsg.style.color = "#059669";
                    errorMsg.innerText = "A new code has been sent to your email!";
                    errorMsg.style.display = "block";
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    errorMsg.className = "error-msg";
                    errorMsg.style.backgroundColor = "#fee2e2";
                    errorMsg.style.color = "#dc2626";
                    errorMsg.innerText = errorData.message || "Failed to resend code.";
                    errorMsg.style.display = "block";
                }
            } catch (error) {
                errorMsg.className = "error-msg";
                errorMsg.style.backgroundColor = "#fee2e2";
                errorMsg.style.color = "#dc2626";
                errorMsg.innerText = "Server connection error.";
                errorMsg.style.display = "block";
            }
        }
    </script>
</body>
</html>
