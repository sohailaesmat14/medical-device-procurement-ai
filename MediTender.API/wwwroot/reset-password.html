<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediProcure AI - Set New Password</title>
    <script src="./script/config.js"></script>
    <link rel="stylesheet" href="./style/theme.css">
    <link rel="stylesheet" href="./style/auth.css">

    <!-- SEO Meta Tags -->
        <meta name="description" content="MediProcure AI - The future of intelligent medical tendering and vendor offer analysis.">
        
        <!-- Open Graph  -->
        <meta property="og:title" content="MediProcure AI">
        <meta property="og:description" content="AI-powered medical tendering and vendor offer evaluation system.">
        <meta property="og:image" content="./assets/og-preview.png">
        <meta property="og:type" content="website">
        
        <!-- Favicon  -->
        <link rel="icon" type="image/png" href="./assets/favicon.png">
        <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
    
</head>
<body>
    <div class="auth-container">
        <h2 style="color: var(--text-main); margin-top: 0; margin-bottom: 10px;">Set New Password</h2>
        <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 25px;">Enter your email, the 6-digit code, and your new password.</p>        
        <div id="errorMsg" class="error-msg" aria-live="assertive"></div>

        <form onsubmit="event.preventDefault(); submitNewPassword();">
            <div class="input-group">
                <label for="emailInput">Work Email</label>
                <input type="email" id="emailInput" placeholder="name@hospital.com" required>
            </div>

            <div class="input-group">
                <label for="resetCode">Reset Code</label>
                <input type="text" id="resetCode" placeholder="000000" maxlength="6" required>
            </div>
            
            <div class="input-group">
                <label for="newPassword">New Password</label>
                <div class="password-container">
                    <input type="password" id="password" placeholder="Min 8 chars (Upper, Lower, Number, Symbol)" required minlength="8" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[@$!%*?&]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters">
                    <button type="button" class="toggle-password" aria-label="Toggle password visibility" title="Show/Hide Password" onclick="togglePasswordVisibility('password', this)">👁️</button>                </div>
            </div>

            <button type="submit" class="auth-btn" id="submitBtn">Update Password</button>
            <div style="margin-top: 20px; font-size: 14px; color: var(--text-muted);">
                Didn't receive the code? 
                <button type="button" id="resendBtn" onclick="resendResetCode()" style="background: none; border: none; color: var(--primary-blue); font-weight: bold; cursor: pointer; padding: 0;">Resend Code</button>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const storedEmail = sessionStorage.getItem("reset_email");
            if (storedEmail) {
                document.getElementById("emailInput").value = storedEmail;
            }
        });

        async function submitNewPassword() {
            const email = document.getElementById('emailInput').value.trim();
            const code = document.getElementById('resetCode').value.trim();
            const newPassword = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.getElementById('submitBtn');

            if (!email) {
                errorMsg.innerText = "Please enter your email.";
                errorMsg.style.display = "block";
                return;
            }

            btn.disabled = true;
            btn.innerText = "Updating...";

            try {
                const response = await fetchWithTimeout(`${CONFIG.API_BASE_URL}/api/Auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, code: code, newPassword: newPassword })
                });

                if (response.ok) {
                    showToast("Password updated successfully! Please login with your new password.", "success");
                    sessionStorage.removeItem("reset_email");
                    setTimeout(() => window.location.replace("login.html"), 1500);
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    errorMsg.className = "error-msg";
                    errorMsg.style.backgroundColor = "#fee2e2";
                    errorMsg.style.color = "#dc2626";
                    errorMsg.innerText = errorData.message || "Invalid or expired code.";
                    errorMsg.style.display = "block";
                    btn.disabled = false;
                    btn.innerText = "Update Password";
                }
            } catch (error) {
                errorMsg.className = "error-msg";
                errorMsg.style.backgroundColor = "#fee2e2";
                errorMsg.style.color = "#dc2626";
                errorMsg.innerText = "Server connection error.";
                errorMsg.style.display = "block";
                btn.disabled = false;
                btn.innerText = "Update Password";
            }
        }

        async function resendResetCode() {
            const email = document.getElementById('emailInput').value.trim();
            const resendBtn = document.getElementById('resendBtn');
            const errorMsg = document.getElementById('errorMsg');

            if (!email) {
                errorMsg.className = "error-msg";
                errorMsg.style.backgroundColor = "#fee2e2";
                errorMsg.style.color = "#dc2626";
                errorMsg.innerText = "Please enter your email first to resend the code.";
                errorMsg.style.display = "block";
                return;
            }

            resendBtn.disabled = true;
            let timeLeft = 30; 
            
            const countdownInterval = setInterval(() => {
                resendBtn.innerText = `Wait ${timeLeft}s`;
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    resendBtn.innerText = "Resend Code";
                    resendBtn.disabled = false;
                }
            }, 1000);

            try {
                const response = await fetchWithTimeout(`${CONFIG.API_BASE_URL}/api/Auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                if (response.ok) {
                    errorMsg.className = "error-msg"; 
                    errorMsg.style.backgroundColor = "#d1fae5"; 
                    errorMsg.style.color = "#059669";
                    errorMsg.innerText = "A new reset code has been sent!";
                    errorMsg.style.display = "block";
                } else {
                    errorMsg.className = "error-msg";
                    errorMsg.style.backgroundColor = "#fee2e2";
                    errorMsg.style.color = "#dc2626";
                    errorMsg.innerText = "Failed to resend code.";
                    errorMsg.style.display = "block";
                }
            } catch (error) {
                errorMsg.className = "error-msg";
                errorMsg.style.backgroundColor = "#fee2e2";
                errorMsg.style.color = "#dc2626";
                errorMsg.innerText = "Server connection error.";
                errorMsg.style.display = "block";
            }
        }    
    </script>
</body>
</html>
