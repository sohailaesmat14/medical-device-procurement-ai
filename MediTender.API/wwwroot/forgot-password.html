<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediProcure AI - Forgot Password</title>
    <script src="./script/config.js"></script>
    <link rel="stylesheet" href="./style/theme.css">
    <link rel="stylesheet" href="./style/forgot-password.css">
    <link rel="stylesheet" href="./style/home.css">

    <!-- SEO Meta Tags -->
        <meta name="description" content="MediProcure AI - The future of intelligent medical tendering and vendor offer analysis.">
        
        <!-- Open Graph  -->
        <meta property="og:title" content="MediProcure AI">
        <meta property="og:description" content="AI-powered medical tendering and vendor offer evaluation system.">
        <meta property="og:image" content="./assets/og-preview.png">
        <meta property="og:type" content="website">
        
        <!-- Favicon  -->
        <link rel="icon" type="image/png" href="./assets/logo.png">
        <link rel="logo" href="./assets/logo.png">
</head>
<body>
    <div class="auth-container">
        <a href="home.html" class="logo">
                <span>MediProcure</span>  <span>AI</span>
        </a>
        
        <h2 style="color: #1e293b; margin-top: 0; margin-bottom: 10px;">Reset Password</h2>
        <p style="color: #64748b; font-size: 14px; margin-bottom: 25px;">Enter your email and we will send you a reset code.</p>
        
        <div id="msgBox" class="error-msg"></div>

        <form onsubmit="event.preventDefault(); requestReset();">
            <div class="input-group">
                <label for="email">Work Email</label>
                <input type="email" id="email" placeholder="name@hospital.com" required>
            </div>
            <button type="submit" class="auth-btn" id="submitBtn">Send Reset Code</button>
        </form>

        <div class="back-link">
            <a href="login.html">← Back to Login</a>
        </div>
    </div>
    <script src="./script/forgot-password.js"></script>
</body>
</html>
