<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediProcure AI - Forgot Password</title>
    <script src="./script/config.js"></script>
    <link rel="stylesheet" href="./style/theme.css">
    <link rel="stylesheet" href="./style/forgot-password.css">
    <link rel="stylesheet" href="./style/home.css">
</head>
<body>
    <div class="auth-container">
        <a href="home.html" class="logo"><span>MediProcure</span> <span>AI</span></a>
        
        <h2 style="color: #1e293b; margin-top: 0; margin-bottom: 10px;">Reset Password</h2>
        <p style="color: #64748b; font-size: 14px; margin-bottom: 25px;">Enter your email and we will send you a reset code.</p>
        
        <div id="msgBox" class="error-msg"></div>

        <form onsubmit="event.preventDefault(); requestReset();">
            <div class="input-group">
                <label for="email">Work Email</label>
                <input type="email" id="email" placeholder="name@hospital.com" required>
            </div>
            <button type="submit" class="auth-btn" id="submitBtn">Send Reset Code</button>
        </form>

        <div class="back-link">
            <a href="login.html">← Back to Login</a>
        </div>
    </div>

    <script>
        async function requestReset() {
            const email = document.getElementById('email').value.trim();
            const msgBox = document.getElementById('msgBox');
            const btn = document.getElementById('submitBtn');

            btn.disabled = true;
            btn.innerText = "Sending...";

            try {
                const response = await fetchWithTimeout(`${CONFIG.API_BASE_URL}/api/Auth/forgot-password`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({ email: email }),
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.message || "A server error occurred. Please try again later.");
                    }

                    sessionStorage.setItem("reset_email", email);
                    window.location.replace("reset-password.html");
                
            } catch (error) {
                msgBox.className = "error-msg";
                msgBox.innerText = error.message || "Server connection error.";
                msgBox.style.display = "block";
                btn.disabled = false;
                btn.innerText = "Send Reset Code";
            }
        }    
    </script>
</body>
</html>
