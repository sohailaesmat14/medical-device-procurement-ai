<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediProcure AI - Forgot Password</title>
    <script src="config.js"></script>
    <style>
        /* Shared Styles (same as above) */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f4f7f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .auth-container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); width: 100%; max-width: 400px; text-align: center; margin: 20px; }
        .logo { font-size: 24px; font-weight: bold; margin-bottom: 20px; color: #111827; text-decoration: none; display: inline-block; }
        .logo span { color: #10b981; }
        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #475569; font-weight: bold; }
        input[type="email"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .auth-btn { background-color: #2563eb; color: white; border: none; width: 100%; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .error-msg, .success-msg { font-size: 14px; margin-bottom: 15px; display: none; font-weight: bold; padding: 10px; border-radius: 6px; }
        .error-msg { color: #dc2626; background: #fee2e2; }
        .success-msg { color: #059669; background: #d1fae5; }
        .back-link { margin-top: 20px; font-size: 14px; }
        .back-link a { color: #2563eb; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="auth-container">
        <a href="home.html" class="logo">MediProcure <span>AI</span></a>
        
        <h2 style="color: #1e293b; margin-top: 0; margin-bottom: 10px;">Reset Password</h2>
        <p style="color: #64748b; font-size: 14px; margin-bottom: 25px;">Enter your email and we will send you a reset code.</p>
        
        <div id="msgBox" class="error-msg"></div>

        <form onsubmit="event.preventDefault(); requestReset();">
            <div class="input-group">
                <label for="email">Work Email</label>
                <input type="email" id="email" placeholder="name@hospital.com" required>
            </div>
            <button type="submit" class="auth-btn" id="submitBtn">Send Reset Code</button>
        </form>

        <div class="back-link">
            <a href="login.html">← Back to Login</a>
        </div>
    </div>

    <script>
        async function requestReset() {
            const email = document.getElementById('email').value.trim();
            const msgBox = document.getElementById('msgBox');
            const btn = document.getElementById('submitBtn');

            btn.disabled = true;
            btn.innerText = "Sending...";

            try {
                const response = await fetch(`${CONFIG.API_BASE_URL}/api/Auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                // Regardless of success/fail, we show the same message for security (so hackers can't guess emails)
                sessionStorage.setItem("reset_email", email);
                window.location.replace("reset-password.html");
                
            } catch (error) {
                msgBox.className = "error-msg";
                msgBox.innerText = "Server connection error.";
                msgBox.style.display = "block";
                btn.disabled = false;
                btn.innerText = "Send Reset Code";
            }
        }
    </script>
</body>
</html>
