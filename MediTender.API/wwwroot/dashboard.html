<!doctype html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MediProcure AI - BI Decision Matrix</title>
        <script src="https://cdn.jsdelivr.net/gh/linways/table-to-excel@1.0.4/dist/tableToExcel.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="./script/config.js"></script>
        <link rel="stylesheet" href="./style/theme.css">
        <link rel="stylesheet" href="./style/dashboard.css">
        <link rel="stylesheet" href="./style/home.css">
        <style>header {position: relative;}</style>

        <!-- SEO Meta Tags -->
        <meta name="description" content="MediProcure AI - The future of intelligent medical tendering and vendor offer analysis.">
        
        <!-- Open Graph  -->
        <meta property="og:title" content="MediProcure AI">
        <meta property="og:description" content="AI-powered medical tendering and vendor offer evaluation system.">
        <meta property="og:image" content="./assets/og-preview.png">
        <meta property="og:type" content="website">
        
        <!-- Favicon  -->
        <link rel="icon" type="image/png" href="./assets/logo.png">
        <link rel="logo" href="./assets/logo.png">
    </head>
    <body>
        <header>
            <a href="home.html" class="logo">
                <img src="./assets/logo.png" alt="Icon" class="logo-icon">
                MediProcure <span>AI</span>
            </a>
            <div class="header-actions" style="display: flex; gap: 15px; align-items: center; position: absolute; right: 20px; top: 20px;">
                <a href="upload.html" style="background-color: #2563eb; color: white; padding: 8px 16px; text-decoration: none; border-radius: 6px; font-weight: bold; border: none;">
                    + New Analysis
                </a>
                <a href="my-tenders.html" style="background-color: #475569; color: white; padding: 8px 16px; text-decoration: none; border-radius: 6px; font-weight: bold; border: none;">📂 History</a>
            </div>
        </header>
        <div class="dashboard-modal-overlay" id="confirmModal">
            <div class="dashboard-modal-content">
                <h3 style="margin-top: 0; color: #1e293b">
                    Confirm Manual Approval
                </h3>
                <p
                    id="confirmModalText"
                    style="color: #475569; font-size: 14px; line-height: 1.5"
                ></p>
                <div class="dashboard-modal-actions">
                    <button
                        class="btn-cancel"
                        onclick="
                            document.getElementById(
                                'confirmModal',
                            ).style.display = 'none'
                        "
                    >
                        Cancel
                    </button>
                    <button class="btn-confirm" id="confirmModalBtn">
                        Yes, Approve
                    </button>
                </div>
            </div>
        </div>
        <div class="container" id="dashboardContent">
        </div>
        <script src="./script/dashboard.js"></script>
    </body>
</html>
