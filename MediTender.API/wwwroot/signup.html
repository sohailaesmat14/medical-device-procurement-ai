<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediProcure AI - Sign Up</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            background-color: #f4f7f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .signup-container { 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); 
            width: 100%; 
            max-width: 450px; 
            text-align: center; 
            margin: 20px;
        }
        .logo { 
            font-size: 24px; 
            font-weight: bold; 
            margin-bottom: 20px; 
            color: #111827; 
            text-decoration: none;
            display: inline-block;
        }
        .logo span { color: #10b981; }
        
        .avatar-placeholder {
            width: 80px;
            height: 80px;
            background-color: #e2e8f0;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            font-size: 32px;
            color: #94a3b8;
            border: 2px dashed #cbd5e1;
        }

        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #475569;
            font-weight: bold;
        }
        input[type="text"], input[type="email"], input[type="password"] { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box; 
            transition: border-color 0.3s;
        }
        input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: #2563eb;
        }
        
        .signup-btn { 
            background-color: #2563eb; 
            color: white; 
            border: none; 
            width: 100%; 
            padding: 15px; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s; 
            margin-top: 10px;
        }
        .signup-btn:hover { background-color: #1d4ed8; }
        
        .error-msg { 
            color: #dc2626; 
            font-size: 14px; 
            margin-bottom: 15px; 
            display: none; 
            font-weight: bold; 
            background: #fee2e2;
            padding: 10px;
            border-radius: 6px;
        }
        
        .login-link {
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
        }
        .login-link a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <a href="home.html" class="logo">MediProcure <span>AI</span> 🤖</a>
        
        <div class="avatar-placeholder">👤</div>
        
        <h2 style="color: #1e293b; margin-top: 0; margin-bottom: 10px;">Create an Account</h2>
        <p style="color: #64748b; font-size: 14px; margin-bottom: 25px;">Join the future of intelligent tendering.</p>
        
        <div id="errorMsg" class="error-msg"></div>

        <form id="signupForm" onsubmit="event.preventDefault(); performSignup();">
            <div class="input-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" placeholder="e.g., Eng. Suhaila" required>
            </div>
            
            <div class="input-group">
                <label for="email">Work Email</label>
                <input type="email" id="email" placeholder="name@hospital.com" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a strong password" required minlength="6">
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Repeat your password" required minlength="6">
            </div>

            <button type="submit" class="signup-btn">Sign Up & Continue</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="login.html">Sign In here</a>
        </div>
    </div>

    <script>
        async function performSignup() {
            const fullname = document.getElementById('fullname').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorMsg = document.getElementById('errorMsg');

            if (password !== confirmPassword) {
                errorMsg.innerText = "Passwords do not match. Please try again.";
                errorMsg.style.display = "block";
                return;
            }
            errorMsg.style.display = "none";

            try {
                const response = await fetch(`${CONFIG.API_BASE_URL}/api/Auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName: fullname, email: email, password: password })
                });

                if (response.ok) {
                    const data = await response.json();
                    sessionStorage.setItem("jwt_token", data.token);
                    sessionStorage.setItem("user_name", fullname);
                    sessionStorage.setItem("user_email", email); // Save email for plan update
                    window.location.href = "subscription.html";
                } else {
                    const errorData = await response.json();
                    errorMsg.innerText = errorData.message || "Failed to create account.";
                    errorMsg.style.display = "block";
                }
            } catch (error) {
                errorMsg.innerText = "Server connection error.";
                errorMsg.style.display = "block";
            }
        }
    </script>
</body>
</html>
