<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediProcure AI - Sign Up</title>
    <script src="./script/config.js"></script>
    <link rel="stylesheet" href="./style/theme.css">
    <link rel="stylesheet" href="./style/auth.css">
    <link rel="stylesheet" href="./style/home.css">
</head>
<body>

    <div class="auth-container">
        <a href="home.html" class="logo"><span>MediProcure</span> <span>AI</span> </a>
        
        <div class="avatar-placeholder">👤</div>
        
        <h2 style="color: var(--text-main); margin-top: 0; margin-bottom: 10px;">Create an Account</h2>
        <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 25px;">Join the future of intelligent tendering.</p>
        
        <div id="errorMsg" class="error-msg" aria-live="assertive"></div>

        <form id="signupForm" onsubmit="event.preventDefault(); performSignup();">
            <div class="input-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" placeholder="e.g., Eng. Suhaila" required>
            </div>
            
            <div class="input-group">
                <label for="email">Work Email</label>
                <input type="email" id="email" placeholder="name@hospital.com" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-container">
                    <input type="password" id="password" placeholder="Min 8 chars: upper, lower, number, symbol" required minlength="8"
                    pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[@$!%*?&]).{8,}"
                    title="Must be at least 8 characters and include an uppercase letter, a lowercase letter, a number, and a special character (@$!%*?&).">
                    <button type="button" class="toggle-password" aria-label="Toggle password visibility" title="Show/Hide Password" onclick="togglePasswordVisibility('password', this)">👁️</button>                
                </div>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="password-container">
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required minlength="8">
                    <button type="button" class="toggle-password" aria-label="Toggle password visibility" title="Show/Hide Password" onclick="togglePasswordVisibility('confirmPassword', this)">👁️</button>                
                </div>
            </div>

            <button type="submit" class="auth-btn">Sign Up & Continue</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="login.html">Sign In here</a>
        </div>
    </div>

    <script>
       async function performSignup() {
            const nameEl = document.getElementById('fullname');       
            const emailEl = document.getElementById('email');         
            const passwordEl = document.getElementById('password');
            const confirmEl = document.getElementById('confirmPassword');
            const errorMsg = document.getElementById('errorMsg');
            const signupBtn = document.querySelector('.auth-btn'); 

            if (!nameEl || !emailEl || !passwordEl || !confirmEl) return;

            const name = nameEl.value.trim();
            const email = emailEl.value.trim();
            const password = passwordEl.value;
            const confirm = confirmEl.value;

            if (password !== confirm) {
                errorMsg.innerText = "Passwords do not match.";
                errorMsg.style.display = "block";
                return;
            }

            signupBtn.disabled = true;
            signupBtn.innerText = "Creating Account... ⏳";
            signupBtn.style.opacity = "0.7";
            errorMsg.style.display = "none";

            try {
                const response = await fetchWithTimeout(`${CONFIG.API_BASE_URL}/api/Auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName: name, email: email, password: password })
                });

                if (response.ok) {
                    sessionStorage.setItem("temp_user_email", email);

                    errorMsg.className = "error-msg";
                    errorMsg.style.backgroundColor = "#d1fae5";
                    errorMsg.style.color = "#059669";
                    errorMsg.innerText = "Account created successfully! Redirecting to verification...";
                    errorMsg.style.display = "block";

                    setTimeout(() => {
                        window.location.replace("verify-email.html");
                    }, 2000);

                } else {
                    const errorData = await response.json();

                    if (errorData.errors) {
                        const firstErrorKey = Object.keys(errorData.errors)[0];
                        errorMsg.innerText = errorData.errors[firstErrorKey][0];
                    } else if (errorData.message) {
                        errorMsg.innerText = errorData.message;
                    } else {
                        errorMsg.innerText = "Failed to create account. Please check your inputs.";
                    }

                    errorMsg.className = "error-msg";
                    errorMsg.style.backgroundColor = "#fee2e2";
                    errorMsg.style.color = "#dc2626";
                    errorMsg.style.display = "block";

                    signupBtn.disabled = false;
                    signupBtn.innerText = "Sign Up & Continue";
                    signupBtn.style.opacity = "1";
                }
            } catch (error) {
                errorMsg.className = "error-msg";
                errorMsg.style.backgroundColor = "#fee2e2";
                errorMsg.style.color = "#dc2626";
                errorMsg.innerText = "Server connection error.";
                errorMsg.style.display = "block";

                signupBtn.disabled = false;
                signupBtn.innerText = "Sign Up & Continue";
                signupBtn.style.opacity = "1";
            }
        }    
    </script>
</body>
</html>
