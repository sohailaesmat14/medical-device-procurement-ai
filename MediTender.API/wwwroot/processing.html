<!doctype html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MediProcure AI - Processing</title>
        <script src="./script/config.js"></script>
        <link rel="stylesheet" href="./style/theme.css">
        <link rel="stylesheet" href="./style/processing.css">

        <!-- SEO Meta Tags -->
        <meta name="description" content="MediProcure AI - The future of intelligent medical tendering and vendor offer analysis.">
        
        <!-- Open Graph  -->
        <meta property="og:title" content="MediProcure AI">
        <meta property="og:description" content="AI-powered medical tendering and vendor offer evaluation system.">
        <meta property="og:image" content="./assets/og-preview.png">
        <meta property="og:type" content="website">
        
        <!-- Favicon  -->
        <link rel="icon" type="image/png" href="./assets/logo.png">
        <link rel="logo" href="./assets/logo.png">
    </head>
    <body>
        <header>
            <a href="home.html" class="logo">
                <img src="./assets/logo.png" alt="Icon" class="logo-icon">
                MediProcure <span>AI</span>
            </a>
            <div class="header-left">
                <div class="user-profile">
                    <div class="avatar" id="userAvatar">U</div>
                    <div class="user-details">
                        <strong id="userNameDisplay">User Name</strong><br />
                    </div>
                </div>
            </div>
        </header>

        <div class="loading-container">
            <div class="spinner-wrapper" id="spinnerWrapper">
                <div class="spinner"></div>
                <div class="brain-icon">🧠</div>
            </div>
            <h2 id="mainTitle">AI Engine is Working...</h2>
            <p id="processStatus">Initializing RAG extraction pipeline...</p>

            <div class="progress-wrapper" id="progressWrapper">
                <div class="progress-fill" id="progressFill">0%</div>
            </div>

            <div id="errorContainer" style="display: none; margin-top: 20px; padding: 15px; border-left: 4px solid var(--danger-color); background-color: #fee2e2;">
                <p id="errorMessage" style="color: #b91c1c; font-weight: 500; margin-bottom: 15px;"></p>
                <button id="retryBtn" class="retry-btn" style="display: inline-block;">
                    Resume Processing 🔄
                </button>
            </div>
        </div>

        <script src="./script/processing.js"></script>
    </body>
</html>
